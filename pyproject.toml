[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-code-rag"
version = "0.1.0"
description = "Local, offline code search and grounded chat for a single repository: AST symbol index + vector search + Ollama."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Govind" }]
dependencies = [
    "chromadb>=0.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ollama = ["ollama>=0.4"]
ui = ["streamlit>=1.35", "ollama>=0.4"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
lcr = "local_code_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["examples/sample_repo"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
